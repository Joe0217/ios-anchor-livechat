name: Hily
options:
  bundleIdPrefix: com.anchor
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # 真机签名：个人免费团队（joe0217@sohu.com）。8J6JP98FM3 是证书 OU 里的真实 Team ID
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 8J6JP98FM3
    TARGETED_DEVICE_FAMILY: "1" # 仅 iPhone
    ENABLE_BITCODE: NO
targets:
  Hily:
    type: application
    platform: iOS
    sources:
      - Sources
      # iOS 17+ 提审：声明使用到的必备 API（UserDefaults）+ 采集数据类别
      - path: Sources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - Vendor/FaceUnity/FUManager.h
      - Vendor/FaceUnity/FUManager.m
      - Vendor/FaceUnity/FUBeautyRenderer.swift
      - path: Vendor/FaceUnity/bundles/face_beautification.bundle
        buildPhase: resources
      - path: Vendor/FaceUnity/bundles/ai_face_processor.bundle
        buildPhase: resources
      # K 需求 4（2026-07-02）：贴纸 bundles 目录（用户拷 FULiveDemo 里的 .bundle 到此，
      # 见 docs/plan/K-sticker-bundle-guide-*.md；bundles/ 已 gitignore 不入库）
      # xcodegen 会把目录下所有 .bundle 递归纳入 resources
      - path: Vendor/FaceUnity/bundles/stickers
        buildPhase: resources
        optional: true
    dependencies:
      - framework: Vendor/FaceUnity/FURenderKit.framework
        embed: true
        codeSign: true
    # 多环境密钥：Debug/Release 当前都绑 dev；prod 上线时新建 Config-Prod.xcconfig 并改 Release
    configFiles:
      Debug: Config/Config-Dev.xcconfig
      Release: Config/Config-Dev.xcconfig
    settings:
      base:
        # 相芯授权证书 authpack 绑定的就是这个包名，给相芯时必须原样一致
        PRODUCT_BUNDLE_IDENTIFIER: com.anchor.livechat
        GENERATE_INFOPLIST_FILE: NO
        # 相芯美颜：OC 桥接头 + authpack.h/FUManager.h 所在目录
        SWIFT_OBJC_BRIDGING_HEADER: Vendor/FaceUnity/Hily-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/Vendor/FaceUnity
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Hily
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        # 提审：本 app 仅使用 iOS 内置加密（HTTPS/系统 API），无自研专有加密 → 走加密豁免（5D992）
        ITSAppUsesNonExemptEncryption: false
        # ATS 显式锁死：AppConfig 全 https/wss 默认即可，显式声明避免依赖 SDK（声网/云信/未来三方）
        # 通过 podspec 静默注入 NSAllowsArbitraryLoads=YES 致整 app ATS 被打开 → 提审 5.1.1/2.5.1 被拒。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsArbitraryLoadsInWebContent: false
        # i18n：en 为默认/开发语言；ar/tr 让 RTL 镜像与文案长度差异在各模块开发期即暴露（J 里程碑收尾真正翻译）
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - ar
          - tr
        # 摄像头权限说明（美颜实时预览必需）；文案改走 InfoPlist.strings 本地化，此处英文兜底
        NSCameraUsageDescription: Used for real-time beauty preview and live streaming
        # 麦克风权限（声网通话音频必需）
        NSMicrophoneUsageDescription: Used for real-time audio/video calls
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        # —— 多环境密钥占位（值由 Config/Config-*.xcconfig 注入）——
        # 注：xcodegen 字面写入 plist；Xcode build 期做 $(VAR) → xcconfig 值替换。
        #     AppConfig 内置 fallback：若 xcconfig 未绑、字面保留 "$(...)"，回 dev 默认值。
        HilyAPIHost: $(HILY_API_HOST)
        HilySAPIHost: $(HILY_SAPI_HOST)
        HilySocketHost: $(HILY_SOCKET_HOST)
        HilyAppID: $(HILY_APP_ID)
        HilyOcpApimKey: $(HILY_OCP_APIM_KEY)
        HilyAppVersion: $(HILY_APP_VERSION)
        HilyNIMAppKey: $(HILY_NIM_APP_KEY)
        HilyAESKey: $(HILY_AES_KEY)
        HilyAESIV: $(HILY_AES_IV)
        # sapi（vvi 派对房/背包商城）AES-128-CBC：dev 巧合与主接口同套；test/prod 是独立的另一套，必须在对应 xcconfig 切
        HilySAPIAESKey: $(HILY_SAPI_AES_KEY)
        HilySAPIAESIV: $(HILY_SAPI_AES_IV)
        HilyWSAESKey: $(HILY_WS_AES_KEY)
        HilyAgoraAppID: $(HILY_AGORA_APP_ID)

  # ─────────────────────────────────────────────
  # 单测 target：logic test bundle，不依赖 Hily app target、不链 FURenderKit / 声网 / 云信，
  # 模拟器/真机都可跑。Sources 只列出待测的纯 Swift 文件（独立编译一份，避开 SDK 牵连）。
  # ─────────────────────────────────────────────
  HilyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/HilyTests
      # 把待测纯 Swift 文件作为 test target 自己的源码编译（独立 module，零 SDK 依赖）
      - path: Sources/Core/CryptoUtil.swift
      - path: Sources/Core/AppConfig.swift
      - path: Sources/Core/AppLogger.swift
      - path: Sources/Core/KeychainStore.swift
      - path: Sources/Networking/APIClient.swift
      # G 里程碑 M1：PK 数据契约 + NIM AttachType（仅纯数据/解析层，零 SDK 依赖）
      - path: Sources/Live/NIM/AttachType.swift
      - path: Sources/PK/PKModels.swift
      - path: Sources/PK/PKContext.swift
      - path: Sources/PK/PKServiceError.swift
      # H 里程碑 M1：IM 通用路由抽象 + payload 解析（无 NIMSDK 依赖；纯 Foundation + Compression）
      - path: Sources/Live/NIM/MessageRouter.swift
      - path: Sources/Live/NIM/NIMPayloadDecoder.swift
      - path: Sources/Party/Utils/GzipDecompressor.swift
      # H 里程碑 M4-6：SystemMessageRouter 决策表（pure，无 SDK 依赖）
      - path: Sources/Live/NIM/SystemMessageRouteDecision.swift
      # H 里程碑 M7：IM 场景过滤纯函数（pure，无 SDK 依赖；IMSceneGate 副作用层含 @MainActor 不入测）
      - path: Sources/Live/NIM/IMSceneFilter.swift
      # H-1 P2P 会话列表 MVP：model + classifier + event 合并 + Store（依赖 protocol 注入，零 SDK 依赖）
      - path: Sources/Message/Models/MessageSession.swift
      - path: Sources/Message/Models/MessageSessionCategory.swift
      - path: Sources/Message/Models/MessageSessionEvent.swift
      - path: Sources/Message/Models/MessageSessionState.swift
      - path: Sources/Message/MessageSessionProviders.swift
      - path: Sources/Message/MessageSessionStore.swift
      # H-1 Step 1c：Prime 拉取 service + Codable model（分批 ≤50 + 部分批失败仅该批不进；APIClient 已入）
      - path: Sources/Message/Services/PrimeLevelModels.swift
      - path: Sources/Message/Services/PrimeLevelService.swift
      # H-1c v4：Flame 顶部 3 系统消息入口（Station HTTP / Notification P2P / Admin P2P）
      - path: Sources/Message/Models/SystemInboxEntry.swift
      - path: Sources/Message/Services/StationListModels.swift
      - path: Sources/Message/Services/StationListService.swift
      - path: Sources/Message/Services/CustomerServiceIdStore.swift
      # H-1d v4：对端用户画像批查（apiBatchQueryYxStat）覆盖 nickname/icon
      - path: Sources/Message/Services/ConversationProfileService.swift
      # H-1e v4：在线状态常量表（对齐 H5 LIVE_STATUS_NUMBER；纯 Int 常量）
      - path: Sources/Message/Models/AnchorOnlineStatus.swift
      # H 里程碑 M3：派对房 attachType 枚举（纯 Int rawValue，无 NIMSDK 依赖）
      - path: Sources/Party/Models/PartyAttachType.swift
      - path: Sources/Party/Models/PartyMsgType.swift
      # E 里程碑 C 档单测（2026-06-26）：派对房 model / 解析 / Identity / 跨通道归一化（纯 Foundation + Codable，零 SDK 依赖）
      - path: Sources/Party/Models/PartyEnums.swift
      - path: Sources/Party/Models/PartyEvents.swift
      - path: Sources/Party/Models/PartyRoomInfo.swift
      - path: Sources/Party/Models/PartyRoomSeat.swift
      - path: Sources/Party/Utils/PartyValueNormalizer.swift
      - path: Sources/Party/NIM/PartyKickedOutGuard.swift
      # G 里程碑 M2：PKCountdownController（纯 Foundation Task；PKStore 状态机依赖 SDK 不入测）
      - path: Sources/PK/PKCountdownController.swift
      # A 里程碑 trial #1 (Circle 朋友圈 tab)：纯枚举 + 状态机 + 服务层 protocol
      # 注意：枚举的 +Label.swift extension 依赖 L10n，**不**入 sources（label 是 view 层关注）
      - path: Sources/Home/HomeTopTab.swift
      - path: Sources/Home/Circle/CircleSubTab.swift
      - path: Sources/Home/Circle/HomeTopTabStore.swift
      - path: Sources/Home/Circle/CircleStore.swift
      - path: Sources/Home/Circle/MomentFeedStore.swift
      - path: Sources/Profile/Moment/CircleService.swift
      - path: Sources/Profile/Moment/MomentModels.swift
      - path: Sources/Profile/AnchorTierClassifier.swift
      # I 里程碑 I-1 (黑名单列表)：纯数据模型 + State + Protocol + @MainActor ViewModel + Service decode
      # 注意：BlocklistViewModel+Runtime.swift 依赖 L10n/BlocklistService.shared，不入 sources
      - path: Sources/Profile/Settings/Blocklist/BlocklistModels.swift
      - path: Sources/Profile/Settings/Blocklist/BlocklistViewModel.swift
      - path: Sources/Profile/Settings/Blocklist/BlocklistService.swift
      # List 子页 H5 对齐：纯模型 + 状态机 + Protocol + ViewModel + Service decode
      # 注意：LiveListSegment+Label.swift 依赖 L10n，不入 sources
      - path: Sources/Home/LiveTab/List/LiveListModels.swift
      - path: Sources/Home/LiveTab/List/LiveListViewModel.swift
      - path: Sources/Home/LiveTab/List/LiveListService.swift
      # H 里程碑 H-0 (用户详情页 step 1a)：Models + State + Protocol + @MainActor ViewModel + Service stub
      # step 1c 替换 stub 为真接口；step 1a 仅 stub 抛 stubNotImplemented
      - path: Sources/Profile/UserProfile/UserProfileModels.swift
      - path: Sources/Profile/UserProfile/UserProfileViewModel.swift
      - path: Sources/Profile/UserProfile/UserProfileService.swift
      # `.followRelationChanged` Notification 抽出独立小文件（H-0 step 1a 复用此通知做跨页同步）
      - path: Sources/Profile/FollowList/FollowRelationNotification.swift
      # Core/Upload（通用上传能力，Step 5 重构后从 J 里程碑抽出到 Core/）
      # 注意：ImageCompressor.swift + ImageUploader.swift + OssCredentialService/OssUploadService 依赖 UIKit/APIClient/URLSession 不入 sources
      - path: Sources/Core/Upload/OssCredential.swift
      - path: Sources/Core/Upload/OssCredentialServiceProtocol.swift
      - path: Sources/Core/Upload/OssUploadServiceProtocol.swift
      - path: Sources/Core/Upload/OssMultipartBodyBuilder.swift
      - path: Sources/Core/Upload/ImageCompressionPreset.swift
      # J 里程碑（发布朋友圈 step 1a）：纯 Swift 模型 + protocol + ViewModel
      - path: Sources/Home/Circle/Publish/PostPublishModels.swift
      - path: Sources/Home/Circle/Publish/PostPublishServiceProtocol.swift
      - path: Sources/Home/Circle/Publish/PostPublishViewModel.swift
      # H 里程碑 H-2 (私密媒体解锁 step 1a)：Models + Store + Service stub（真接口 step 1c）
      - path: Sources/Work/GiftMessage/GiftMessageModels.swift
      - path: Sources/Work/GiftMessage/GiftMessageStore.swift
      # 注意：GiftMessageService.swift / PrivateMediaUploadService.swift 真实现依赖 GiftService/OSS 集成路径，不入 tests；
      # Store 单测通过 protocol 注入 FakeGiftMessageService / FakePrivateMediaUploadService（Tests/HilyTests/GiftMessage/）
      # K 里程碑（美颜设置页 step 1a）：纯 Swift 模型 + 状态机 + Store + Sharer（无 SDK 依赖）
      # 注意：FUBeautyRenderer.swift 依赖 FURenderKit 不入 sources；tests 只覆盖 protocol + 逻辑层
      - path: Sources/Beauty/BeautyError.swift
      - path: Sources/Beauty/BeautyParameters.swift
      - path: Sources/Beauty/BeautyRenderer.swift
      - path: Sources/Beauty/BeautySettings.swift
      - path: Sources/Beauty/ReflexType.swift
      - path: Sources/Core/Media/BeautyPipeline/BeautySettingsPersistence.swift
      - path: Sources/Core/Media/BeautyPipeline/BeautySettingsStore.swift
      - path: Sources/Core/Media/BeautyPipeline/BeautyPipelineSharer.swift
      # L 里程碑（Match step 1a）：纯 Swift 模型 + 状态机 + Service + Persistence（无 SDK 依赖）
      # 注意：MatchCameraSession 具体实现（step 1b）依赖 CameraManager/AVCaptureSession 不入 tests；
      # Store 单测通过 protocol 注入 FakeMatchService + FakeMatchCameraSession
      - path: Sources/Match/MatchModels.swift
      - path: Sources/Match/MatchPersistedState.swift
      - path: Sources/Match/MatchService.swift
      - path: Sources/Match/MatchStore.swift
      # MatchToast 是纯 enum（不依赖 L10n），供 MatchStore.lastToast 使用；
      # MatchToast+Localized.swift 在 UI/ 目录，依赖 L10n 不入 test target。
      - path: Sources/Match/MatchToast.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anchor.livechat.tests
        GENERATE_INFOPLIST_FILE: YES
        # logic test bundle：无宿主 app，xcodebuild test 直接在模拟器跑
        CODE_SIGNING_ALLOWED: NO
schemes:
  # Hily app scheme：日常开发/真机调试用。
  # ⚠️ test action 故意不带 HilyTests——一旦 build action 拉 Hily.app，模拟器会链接 FURenderKit(arm64 device-only) 失败。
  Hily:
    build:
      targets:
        Hily: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  # 单测专用 scheme：build action 只编 HilyTests，不碰 Hily.app/FURenderKit，模拟器/真机皆可跑。
  # 跑法：xcodebuild test -workspace Hily.xcworkspace -scheme HilyTests -destination 'platform=iOS Simulator,name=iPhone 16 Pro'
  HilyTests:
    build:
      targets:
        HilyTests: all
    test:
      config: Debug
      targets:
        - HilyTests
