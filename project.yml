    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hifunny.party.tests
        GENERATE_INFOPLIST_FILE: YES
        # logic test bundle：无宿主 app，xcodebuild test 直接在模拟器跑
        CODE_SIGNING_ALLOWED: NO
        # H-2：让代码用 `#if HILY_TESTS` 条件编译屏蔽 test target 不可见的依赖
        # （如 MessageSessionStore.shared / L10n / NIMSDK 等在 test target sources 白名单外）
        # ⚠️ 必须保留 DEBUG（BeautyPipelineSharer 的 testForceSetupState 等 DEBUG-only test hook 依赖此 flag）
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG HILY_TESTS"
schemes:
  # Hily app scheme：日常开发/真机调试用。
  # ⚠️ test action 故意不带 HilyTests——一旦 build action 拉 Hily.app，模拟器会链接 FURenderKit(arm64 device-only) 失败。
  Hily:
    build:
      targets:
        Hily: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  # Test 预发布 scheme：Archive 走 Config-Test.xcconfig（anchorpre.cphub.link），
  # 与 Prod 共享后端资源和账号体系，仅接口域名不同，用于上架前 QA 回归验证。
  # 用法：Xcode 顶部 Scheme 切到 Hily-Test → Product → Archive → 分发给 QA。
  Hily-Test:
    build:
      targets:
        Hily: all
    run:
      config: Debug
    profile:
      config: Release-Test
    analyze:
      config: Debug
    archive:
      config: Release-Test
  # Dev 分发 scheme：Archive 走 Config-Dev-Archive.xcconfig（anchor.cphub.link），
  # 密钥/账号/云信/声网与日常 Cmd+R Run 完全一致，供测试用 Dev 账号联调。
  # 用法：Xcode 顶部 Scheme 切到 Hily-Dev → Product → Archive → 分发给测试。
  Hily-Dev:
    build:
      targets:
        Hily: all
    run:
      config: Debug
    profile:
      config: Release-Dev
    analyze:
      config: Debug
    archive:
      config: Release-Dev
  # 单测专用 scheme：build action 只编 HilyTests，不碰 Hily.app/FURenderKit，模拟器/真机皆可跑。
  # 跑法：xcodebuild test -workspace Hily.xcworkspace -scheme HilyTests -destination 'platform=iOS Simulator,name=iPhone 16 Pro'
  HilyTests:
    build:
      targets:
        HilyTests: all
    test:
      config: Debug
      targets:
        - HilyTests
