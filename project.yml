      - path: Sources/Profile/EditProfile/EditProfileServiceProtocol.swift
      - path: Sources/Profile/EditProfile/EditProfileStore.swift
      - path: Sources/Profile/EditProfile/Models/EditProfileModels.swift
      - path: Sources/Profile/EditProfile/Models/CheckUserInfoResponse.swift
      - path: Sources/Profile/EditProfile/Models/UpdateUserInfoRequest.swift
      - path: Sources/Profile/EditProfile/Models/UserInfoWithReviewResponse.swift
      - path: Sources/Profile/EditProfile/Models/LatestIconAndCallVideo.swift
